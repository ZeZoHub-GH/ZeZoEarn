<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ======================================================================
     CONFIG
     ====================================================================== -->
<script>
const CONFIG = {

  // Links for the "Earn More" button (one is picked at random per click)
  earnLinks: [
    "https://work.ink/2hRI/zezoearn"
  ],

  // Currency shown on the page (the user can change it in the dropdown)
  defaultCurrency: "USD",
  currencies: ["USD", "EUR", "GBP", "CHF", "JPY", "CAD", "AUD", "CNY", "SEK", "NOK", "PLN", "TRY", "INR", "BRL"],

  // Minimum balance needed for a payout - in EUR
  minPayout: 1,

  // Where payout requests are sent (POST, JSON). Without this, payouts are disabled.
  // Example with Formspree: "https://formspree.io/f/xxxxxxxx"
  payoutEndpoint: "https://discord.com/api/webhooks/1559550065469558894/a99o-81piKMNTgU55N74lFxLla4QaOun_zZGMEWuHDtYq4cJL4NmqlCeUTVABlHtTSwz",

  // Discord webhook URL - you get an embed whenever a task is completed
  // (when an amount is credited through the URL). Leave empty to disable.
  webhookUrl: "https://discord.com/api/webhooks/1559550065469558894/a99o-81piKMNTgU55N74lFxLla4QaOun_zZGMEWuHDtYq4cJL4NmqlCeUTVABlHtTSwz",

  // Include the approximate location (city/region/country, looked up from the
  // visitor's IP address - the IP itself is NOT sent to Discord)
  trackLocation: true,

  // URL parameter names (amounts in the URL are ALWAYS in EUR)
  // Example: ?amount=50   or   ?pc=100&mobile=50&tablet=75   or   ?currency=GBP
  params: {
    amount: "amount",
    pc: "pc",
    mobile: "mobile",
    tablet: "tablet",
    currency: "currency"
  }
};
</script>
<!-- ====================================================================== -->

<title>My Balance</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --ease: cubic-bezier(.22, 1, .36, 1);   /* smooth "ease out" curve */
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f1f5f9;
    background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 55%, #020617 100%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Background lights - plain gradients moved with transform only (GPU, cheap) */
  .bg {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 25%, rgba(99,102,241,.6) 0, transparent 28%),
      radial-gradient(circle at 80% 78%, rgba(34,197,94,.45) 0, transparent 28%);
    opacity: .35;
    will-change: transform;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(4%, 3%, 0); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: #1e293b;
    padding: 44px 56px;
    border-radius: 24px;
    text-align: center;
    max-width: 92%;
    border: 1px solid rgba(99,102,241,.4);
    transition: transform .5s var(--ease);
    /* "backwards" so the hover transform is not blocked after the intro finishes */
    animation: intro .9s var(--ease) backwards;
  }
  .card:hover { transform: translate3d(0, -5px, 0); }

  @keyframes intro {
    from { opacity: 0; transform: translate3d(0, 28px, 0) scale(.96); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  /* Glow: static shadow, only the opacity is animated (no repaint = no lag) */
  .glow {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: -1;
    box-shadow:
      0 0 36px rgba(99,102,241,.6),
      0 0 100px rgba(99,102,241,.4),
      0 0 140px rgba(34,197,94,.22);
    will-change: opacity;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .5; }
    50%      { opacity: 1; }
  }

  .label {
    color: #94a3b8;
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .balance {
    font-size: clamp(40px, 11vw, 64px);
    font-weight: 800;
    margin: 14px 0 12px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(99,102,241,.5);
    transition: transform .45s var(--ease);
  }
  .balance.pop { transform: scale(1.07); }

  .currency { margin-bottom: 8px; }
  select {
    appearance: none;
    -webkit-appearance: none;
    background-color: rgba(15, 23, 42, .9);
    color: #cbd5e1;
    border: 1px solid rgba(99,102,241,.4);
    border-radius: 10px;
    padding: 8px 32px 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    transition: border-color .3s ease;
  }
  select:hover, select:focus { border-color: #a5b4fc; }

  /* The list shows "€ - EUR", the closed dropdown shows only "EUR" */
  .selectwrap { position: relative; display: inline-block; }
  .selectwrap select { color: transparent; }
  .selectwrap select option { color: #cbd5e1; background: #0f172a; }
  .selectwrap .shown {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #cbd5e1;
    pointer-events: none;
  }

  .message {
    min-height: 24px;
    color: #4ade80;
    font-size: 15px;
    margin-bottom: 22px;
    opacity: 0;
    transform: translate3d(0, 8px, 0);
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .message.show { opacity: 1; transform: translate3d(0, 0, 0); }
  .message.error { color: #f87171; }

  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    padding: 15px 32px;
    font-weight: 700;
    font-size: 16px;
    font-family: inherit;
    border-radius: 14px;
    text-decoration: none;
    cursor: pointer;
    border: 0;
    transition: transform .35s var(--ease), background-color .3s ease, opacity .3s ease;
  }
  .btn:hover { transform: translate3d(0, -3px, 0) scale(1.04); }
  .btn:active { transform: scale(.96); transition-duration: .1s; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .btn.primary { background: #22c55e; color: #052e16; }
  .btn.primary:hover { background: #4ade80; }
  .btn.secondary {
    background: transparent;
    color: #e0e7ff;
    border: 1px solid rgba(165,180,252,.6);
  }
  .btn.secondary:hover { background: rgba(99,102,241,.22); }

  /* Payout dialog - fades and slides in/out */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(2, 6, 23, .8);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s var(--ease), visibility 0s linear .35s;
  }
  .overlay.open {
    opacity: 1;
    visibility: visible;
    transition: opacity .35s var(--ease), visibility 0s;
  }

  .dialog {
    width: 100%;
    max-width: 400px;
    background: #1e293b;
    border: 1px solid rgba(99,102,241,.5);
    border-radius: 20px;
    padding: 28px;
    text-align: left;
    box-shadow: 0 0 60px rgba(99,102,241,.35);
    transform: translate3d(0, 24px, 0) scale(.96);
    transition: transform .45s var(--ease);
  }
  .overlay.open .dialog { transform: translate3d(0, 0, 0) scale(1); }

  .dialog h2 { margin: 0 0 18px; font-size: 22px; }
  .dialog label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  .dialog label.next { margin-top: 14px; }
  .dialog input {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    color: #f1f5f9;
    border: 1px solid rgba(99,102,241,.4);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color .3s ease;
  }
  .dialog input:focus { border-color: #a5b4fc; }
  .dialog .hint {
    min-height: 20px;
    margin: 10px 0 16px;
    font-size: 14px;
    color: #f87171;
    transition: color .3s ease;
  }
  .dialog .hint.info { color: #94a3b8; }
  .dialog .actions { display: flex; gap: 10px; }
  .dialog .actions .btn { flex: 1; padding: 13px 16px; font-size: 15px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: .01s !important;
    }
  }
  @media (max-width: 480px) {
    .card { padding: 36px 24px; }
    .btn { padding: 14px 24px; }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <div class="glow"></div>
    <div class="label">Your Balance</div>
    <div class="balance" id="balance">0.00</div>
    <div class="currency">
      <div class="selectwrap">
        <select id="currency" aria-label="Currency"></select>
        <span class="shown" id="currencyShown"></span>
      </div>
    </div>
    <div class="message" id="message"></div>
    <div class="buttons">
      <a class="btn primary" id="earn" href="#">Earn More</a>
      <button class="btn secondary" id="payout" type="button">Payout</button>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <form class="dialog" id="form" novalidate>
      <h2>Payout</h2>
      <label for="paypal">PayPal email address</label>
      <input id="paypal" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@example.com">
      <label class="next" for="amount" id="amountLabel">Amount</label>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
      <div class="hint" id="hint"></div>
      <div class="actions">
        <button class="btn secondary" id="cancel" type="button">Cancel</button>
        <button class="btn primary" id="submit" type="submit">Request payout</button>
      </div>
    </form>
  </div>

<script>
(function () {
  var C = CONFIG, P = C.params;
  var BALANCE_KEY = "balance", CURRENCY_KEY = "currency";
  var RATES_URL = "https://api.frankfurter.dev/v1/latest?base=EUR";

  var $ = function (id) { return document.getElementById(id); };
  var balanceEl = $("balance"), messageEl = $("message"), currencyEl = $("currency"),
      earnEl = $("earn"), payoutBtn = $("payout"), overlay = $("overlay"),
      form = $("form"), paypalEl = $("paypal"), hintEl = $("hint"),
      submitEl = $("submit"), amountEl = $("amount"), amountLabelEl = $("amountLabel");

  // ---------- Platform (not displayed) ----------
  function detectPlatform() {
    var ua = navigator.userAgent || "";
    var isTablet = /iPad|Tablet|PlayBook|Silk/i.test(ua) ||
      (/Android/i.test(ua) && !/Mobile/i.test(ua)) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isTablet) return "tablet";
    if (/Mobi|iPhone|iPod|Android/i.test(ua)) return "mobile";
    return "pc";
  }
  var platform = detectPlatform();

  // ---------- Random link ----------
  earnEl.addEventListener("click", function (e) {
    e.preventDefault();
    var link = C.earnLinks[Math.floor(Math.random() * C.earnLinks.length)];
    window.open(link, "_blank", "noopener");
  });

  // ---------- Storage ----------
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) {} }
  function getBalance() {
    var v = parseFloat(load(BALANCE_KEY));
    return isFinite(v) ? v : 0;
  }

  // ---------- Currency ----------
  var params = new URLSearchParams(window.location.search);
  var rates = {
    EUR: 1, USD: 1.08, GBP: 0.85, CHF: 0.94, JPY: 165, CAD: 1.47, AUD: 1.65,
    CNY: 7.8, SEK: 11.5, NOK: 11.7, PLN: 4.3, TRY: 35, INR: 90, BRL: 6.0
  };

  function pickCurrency() {
    var fromUrl = (params.get(P.currency) || "").toUpperCase();
    if (C.currencies.indexOf(fromUrl) !== -1) { save(CURRENCY_KEY, fromUrl); return fromUrl; }
    var stored = load(CURRENCY_KEY);
    if (stored && C.currencies.indexOf(stored) !== -1) return stored;
    return C.defaultCurrency;
  }
  var currency = pickCurrency();

  // Currency sign for the dropdown, e.g. "€ - EUR"
  function currencySymbol(code) {
    try {
      var parts = new Intl.NumberFormat("en-US", {
        style: "currency", currency: code, currencyDisplay: "narrowSymbol"
      }).formatToParts(0);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === "currency") return parts[i].value;
      }
    } catch (e) {}
    return code;
  }

  C.currencies.forEach(function (code) {
    var o = document.createElement("option");
    o.value = code; o.textContent = currencySymbol(code) + " - " + code;
    currencyEl.appendChild(o);
  });
  currencyEl.value = currency;
  $("currencyShown").textContent = currency;

  // Formatter is built once per currency (not on every animation frame)
  var formatter = null;
  function buildFormatter() {
    try {
      formatter = new Intl.NumberFormat("en-US", {
        style: "currency", currency: currency, currencyDisplay: "narrowSymbol"
      });
    } catch (e) { formatter = null; }
  }
  buildFormatter();

  function format(eur) {
    var v = eur * (rates[currency] || 1);
    return formatter ? formatter.format(v) : v.toFixed(2) + " " + currency;
  }

  // ---------- Display ----------
  var shownEur = 0, targetEur = 0, lastText = "", animId = 0;

  function render() {
    var t = format(shownEur);
    if (t !== lastText) { balanceEl.textContent = t; lastText = t; }
  }
  function pop() {
    balanceEl.classList.add("pop");
    setTimeout(function () { balanceEl.classList.remove("pop"); }, 300);
  }
  function animateTo(target, duration) {
    targetEur = target;
    var start = shownEur, t0 = performance.now(), id = ++animId;
    function frame(now) {
      if (id !== animId) return;                       // a newer animation took over
      var p = Math.min((now - t0) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 4);              // smooth ease-out
      shownEur = start + (target - start) * eased;
      render();
      if (p < 1) requestAnimationFrame(frame);
      else { shownEur = target; render(); }
    }
    requestAnimationFrame(frame);
    pop();
  }
  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.classList.toggle("error", !!isError);
    messageEl.classList.add("show");
  }

  currencyEl.addEventListener("change", function () {
    currency = currencyEl.value;
    $("currencyShown").textContent = currency;
    save(CURRENCY_KEY, currency);
    buildFormatter();
    lastText = "";
    animId++;
    shownEur = targetEur;
    render();
    pop();
    updateAmountField();
  });

  // Live exchange rates (fallback rates above are used if this fails)
  fetch(RATES_URL)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.rates) {
        rates = Object.assign({}, rates, d.rates, { EUR: 1 });
        lastText = "";
        render();
      }
    })
    .catch(function () {});

  // ---------- Payout (PayPal email only) ----------
  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  }
  function setHint(text, info) {
    hintEl.textContent = text;
    hintEl.classList.toggle("info", !!info);
  }

  // Amount field: label shows the currency, field starts empty
  function updateAmountField() {
    amountLabelEl.textContent = "Amount (" + currency + ")";
    amountEl.value = "";
  }

  function openPayout() {
    updateAmountField();
    setHint("");
    submitEl.disabled = false;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    setTimeout(function () { paypalEl.focus({ preventScroll: true }); }, 250);
  }
  function closePayout() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    paypalEl.blur();
  }

  payoutBtn.addEventListener("click", openPayout);
  $("cancel").addEventListener("click", closePayout);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closePayout(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePayout(); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = paypalEl.value.trim();
    var bal = getBalance();
    var entered = parseFloat(amountEl.value.replace(",", "."));
    var payoutEur = entered / (rates[currency] || 1);

    if (bal < C.minPayout) {
      setHint("Minimum payout is " + format(C.minPayout) + ". Keep earning!");
      return;
    }
    if (!isValidEmail(email)) {
      setHint("Please enter a valid PayPal email address.");
      return;
    }
    if (!isFinite(entered) || entered <= 0) {
      setHint("Please enter a valid amount.");
      return;
    }
    if (payoutEur > bal + 0.005) {
      setHint("Amount is higher than your balance.");
      return;
    }
    if (payoutEur < C.minPayout - 0.005) {
      setHint("Minimum payout is " + format(C.minPayout) + ".");
      return;
    }
    if (payoutEur > bal) payoutEur = bal;
    var newBal = Math.max(0, bal - payoutEur);
    if (!C.payoutEndpoint) {
      setHint("Payouts are currently not available.");
      return;
    }

    submitEl.disabled = true;
    setHint("Sending request...", true);

    fetch(C.payoutEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        method: "paypal",
        paypalEmail: email,
        amountEUR: Math.round(payoutEur * 100) / 100,
        displayCurrency: currency,
        platform: platform,
        time: new Date().toISOString()
      })
    })
    .then(function (r) {
      if (!r.ok) throw new Error("bad status");
      save(BALANCE_KEY, newBal);
      closePayout();
      paypalEl.value = "";
      setTimeout(function () {
        animateTo(newBal, 1100);
        showMessage("Payout requested. It will be sent to your PayPal.");
      }, 250);
    })
    .catch(function () {
      submitEl.disabled = false;
      setHint("Request failed. Please try again later.");
    });
  });

  // ---------- Amount from URL (always EUR) ----------
  function readAmount() {
    var raw = params.has(P[platform]) ? params.get(P[platform]) : params.get(P.amount);
    return raw === null ? null : parseFloat(raw);
  }

  // ---------- Discord webhook (task completed) ----------
  var PLATFORM_NAMES = { pc: "PC", mobile: "Mobile", tablet: "Tablet" };

  // Random visitor ID so you can tell users apart (stored in the browser)
  function getUserId() {
    var id = load("uid");
    if (!id) {
      var a = new Uint8Array(4);
      (window.crypto || window.msCrypto).getRandomValues(a);
      id = Array.prototype.map.call(a, function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("").toUpperCase();
      save("uid", id);
    }
    return id;
  }

  // Approximate location from the IP address (city, region, country)
  function fetchLocation() {
    if (!C.trackLocation) return Promise.resolve("Not tracked");
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 4000);
    return fetch("https://ipwho.is/?fields=success,city,region,country", ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || d.success === false) return "Unknown";
        var parts = [d.city, d.region, d.country].filter(Boolean);
        return parts.length ? parts.join(", ") : "Unknown";
      })
      .catch(function () { clearTimeout(timer); return "Unknown"; });
  }

  function notifyWebhook(amountEur, totalEur) {
    if (!C.webhookUrl) return;
    fetchLocation().then(function (location) {
      var now = new Date();
      var time = now.toLocaleString("de-DE", {
        timeZone: "Europe/Berlin",
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      return fetch(C.webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          embeds: [{
            title: "Task completed",
            color: 16766720,
            fields: [
              { name: "Amount", value: amountEur.toFixed(2) + " EUR", inline: true },
              { name: "New balance", value: totalEur.toFixed(2) + " EUR", inline: true },
              { name: "Platform", value: PLATFORM_NAMES[platform] || platform, inline: true },
              { name: "Location", value: location, inline: true },
              { name: "User ID", value: "`" + getUserId() + "`", inline: true }
            ],
            footer: { text: "Completed on " + time },
            timestamp: now.toISOString()
          }]
        })
      });
    }).catch(function () {});
  }

  // ---------- Start ----------
  var current = getBalance();
  var hasParam = [P.amount, P.pc, P.mobile, P.tablet].some(function (n) { return params.has(n); });

  shownEur = current;
  targetEur = current;
  render();

  if (hasParam) {
    var amount = readAmount();
    if (amount !== null && isFinite(amount) && amount > 0) {
      var total = current + amount;
      save(BALANCE_KEY, total);
      targetEur = total;
      notifyWebhook(amount, total);
      setTimeout(function () {
        animateTo(total, 1400);
        showMessage("+" + format(amount) + " added");
      }, 600);
    } else if (amount === null) {
      showMessage("No amount for this device in the URL.", true);
    } else {
      showMessage("Invalid amount in the URL.", true);
    }
  }

  // Clean the URL so a reload does not add the amount again
  if (params.toString()) {
    history.replaceState(null, "", window.location.pathname);
  }
})();
</script>
</body>
</html>
