<title>My Balance</title>
<style>
  * { box-sizing: border-box; }

  :root { --ease: cubic-bezier(.22, 1, .36, 1); }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f1f5f9;
    background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 55%, #020617 100%);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .bg {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 25%, rgba(99,102,241,.6) 0, transparent 28%),
      radial-gradient(circle at 80% 78%, rgba(34,197,94,.45) 0, transparent 28%);
    opacity: .35;
    will-change: transform;
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(4%, 3%, 0); }
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
    align-items: center;
  }

  .card {
    position: relative;
    background: #1e293b;
    width: 100%;
    max-width: 520px;
    padding: 36px 32px;
    border-radius: 24px;
    border: 1px solid rgba(99,102,241,.4);
    transition: transform .5s var(--ease);
    animation: intro .9s var(--ease) backwards;
  }
  .card:hover { transform: translate3d(0, -4px, 0); }

  @keyframes intro {
    from { opacity: 0; transform: translate3d(0, 28px, 0) scale(.96); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .glow {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: -1;
    box-shadow:
      0 0 36px rgba(99,102,241,.6),
      0 0 100px rgba(99,102,241,.4),
      0 0 140px rgba(34,197,94,.22);
    will-change: opacity;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .5; }
    50%      { opacity: 1; }
  }

  .top { text-align: center; }

  .label {
    color: #94a3b8;
    font-size: 13px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .balance {
    font-size: clamp(40px, 11vw, 60px);
    font-weight: 800;
    margin: 12px 0 12px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(99,102,241,.5);
    transition: transform .45s var(--ease);
  }
  .balance.pop { transform: scale(1.07); }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-color: rgba(15, 23, 42, .9);
    color: #cbd5e1;
    border: 1px solid rgba(99,102,241,.4);
    border-radius: 10px;
    padding: 8px 32px 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    transition: border-color .3s ease;
  }
  select:hover, select:focus { border-color: #a5b4fc; }

  .selectwrap { position: relative; display: inline-block; }
  .selectwrap select { color: transparent; }
  .selectwrap select option { color: #cbd5e1; background: #0f172a; }
  .selectwrap .shown {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #cbd5e1;
    pointer-events: none;
  }

  .message {
    min-height: 22px;
    margin-top: 12px;
    color: #4ade80;
    font-size: 15px;
    opacity: 0;
    transform: translate3d(0, 8px, 0);
    transition: opacity .5s var(--ease), transform .5s var(--ease);
  }
  .message.show { opacity: 1; transform: translate3d(0, 0, 0); }
  .message.error { color: #f87171; }

  .sep { height: 1px; background: rgba(99,102,241,.22); margin: 22px 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    appearance: none;
    background: transparent;
    color: #cbd5e1;
    border: 1px solid rgba(99,102,241,.4);
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, transform .3s var(--ease);
  }
  .chip:hover { border-color: #a5b4fc; transform: translate3d(0, -2px, 0); }
  .chip.active { background: rgba(99,102,241,.25); border-color: #a5b4fc; color: #fff; }
  .chip.full { opacity: .55; }
  .chip.logo { padding: 9px 18px; display: flex; align-items: center; justify-content: center; }
  .chip img { display: block; height: 22px; width: auto; max-width: 110px; object-fit: contain; }

  .offers { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 14px; min-height: 56px; }
  .offer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(15, 23, 42, .6);
    border: 1px solid rgba(99,102,241,.25);
    border-radius: 14px;
    animation: rowIn .5s var(--ease) backwards;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translate3d(0, 10px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  .offer .name { font-weight: 600; font-size: 15px; }
  .offer .meta { color: #4ade80; font-size: 13px; margin-top: 2px; }
  .empty { color: #94a3b8; font-size: 14px; text-align: center; padding: 14px 0; }

  .row { display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-block;
    padding: 12px 22px;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    border-radius: 12px;
    text-decoration: none;
    cursor: pointer;
    border: 0;
    white-space: nowrap;
    transition: transform .35s var(--ease), background-color .3s ease, opacity .3s ease;
  }
  .btn:hover { transform: translate3d(0, -2px, 0) scale(1.03); }
  .btn:active { transform: scale(.96); transition-duration: .1s; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.sm { padding: 9px 18px; font-size: 14px; }

  .btn.primary { background: #22c55e; color: #052e16; }
  .btn.primary:hover { background: #4ade80; }
  .btn.secondary {
    background: transparent;
    color: #e0e7ff;
    border: 1px solid rgba(165,180,252,.6);
  }
  .btn.secondary:hover { background: rgba(99,102,241,.22); }

  .field {
    width: 100%;
    padding: 12px 14px;
    background: #0f172a;
    color: #f1f5f9;
    border: 1px solid rgba(99,102,241,.4);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color .3s ease;
  }
  .field:focus { border-color: #a5b4fc; }
  form .field + .row { margin-top: 10px; }
  .hint { min-height: 20px; margin-top: 10px; font-size: 14px; color: #f87171; text-align: center; }
  .hint.info { color: #94a3b8; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(2, 6, 23, .96);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s var(--ease), visibility 0s linear .35s;
  }
  .overlay.open { opacity: 1; visibility: visible; transition: opacity .35s var(--ease), visibility 0s; }
  .dialog {
    width: 100%;
    max-width: 400px;
    background: #1e293b;
    border: 1px solid rgba(248,113,113,.6);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 0 60px rgba(248,113,113,.3);
  }
  .dialog h2 { margin: 0 0 10px; font-size: 22px; }
  .dialog p { margin: 0; color: #94a3b8; font-size: 14px; line-height: 1.6; }
  .dialog code { color: #f1f5f9; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: .01s !important;
    }
  }
  @media (max-width: 480px) {
    .card { padding: 28px 20px; }
    .row.pay { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="page">
    <div class="card">
      <div class="glow"></div>

      <div class="top">
        <div class="label">Your Balance</div>
        <div class="balance" id="balance">0.00</div>
        <div class="selectwrap">
          <select id="currency" aria-label="Currency"></select>
          <span class="shown" id="currencyShown"></span>
        </div>
        <div class="message" id="message"></div>
      </div>

      <div class="sep"></div>

      <div class="chips" id="chips"></div>
      <div class="offers" id="offers"></div>

      <div class="sep"></div>

      <form id="payoutForm" novalidate>
        <input class="field" id="paypal" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="PayPal email address">
        <div class="row pay">
          <input class="field" id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="Amount">
          <button class="btn primary" id="payoutBtn" type="submit">Payout</button>
        </div>
        <div class="hint" id="hint"></div>
      </form>
    </div>
  </div>

  <div class="overlay" id="banned" aria-hidden="true">
    <div class="dialog">
      <h2>Banned</h2>
      <p>Your account has been banned.<br>User ID: <code id="bannedId"></code></p>
    </div>
  </div>

<script>
(function () {
  var C = CONFIG;
  var CURRENCY_KEY = "currency", STATE_KEY = "state", PROVIDER_KEY = "provider";
  var RATES_URL = "https://api.frankfurter.dev/v1/latest?base=EUR";
  var EMBED_COLOR = 16766720;
  var PENDING_TTL = 2 * 60 * 60 * 1000;
  var PLATFORM_NAMES = { pc: "PC", mobile: "Mobile", tablet: "Tablet" };

  var $ = function (id) { return document.getElementById(id); };
  var balanceEl = $("balance"), messageEl = $("message"), currencyEl = $("currency"),
      chipsEl = $("chips"), offersEl = $("offers"),
      payoutForm = $("payoutForm"), paypalEl = $("paypal"), amountEl = $("amount"),
      payoutBtn = $("payoutBtn"), hintEl = $("hint"), bannedEl = $("banned");

  var params = new URLSearchParams(window.location.search);

  function detectPlatform() {
    var ua = navigator.userAgent || "";
    var isTablet = /iPad|Tablet|PlayBook|Silk/i.test(ua) ||
      (/Android/i.test(ua) && !/Mobile/i.test(ua)) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isTablet) return "tablet";
    if (/Mobi|iPhone|iPod|Android/i.test(ua)) return "mobile";
    return "pc";
  }
  var platform = detectPlatform();

  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) {} }

  function getUserId() {
    var id = load("uid");
    if (!id) {
      var a = new Uint8Array(4);
      (window.crypto || window.msCrypto).getRandomValues(a);
      id = Array.prototype.map.call(a, function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("").toUpperCase();
      save("uid", id);
    }
    return id;
  }

  function dayKey() {
    try {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: C.resetTimeZone, year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    } catch (e) { return new Date().toISOString().slice(0, 10); }
  }

  var S;
  function loadState() {
    var s = {};
    try { s = JSON.parse(load(STATE_KEY)) || {}; } catch (e) { s = {}; }
    if (!isFinite(s.balance)) s.balance = parseFloat(load("balance")) || 0;
    s.done = s.done || {};
    s.started = s.started || {};
    s.daily = s.daily || { date: "", counts: {} };
    s.lastStart = s.lastStart || 0;
    s.history = Array.isArray(s.history) ? s.history : [];
    var d = dayKey();
    if (s.daily.date !== d) s.daily = { date: d, counts: {} };
    return s;
  }
  var lastRaw = null;
  function saveState() {
    save(STATE_KEY, JSON.stringify(S));
    lastRaw = load(STATE_KEY);
  }

  var offers = [];
  C.providers.forEach(function (p) {
    (p.links || []).forEach(function (l, i) {
      var o = typeof l === "string" ? { url: l } : l;
      offers.push({
        id: p.id + "-" + (i + 1),
        n: i + 1,
        provider: p,
        url: o.url,
        reward: o.reward != null ? o.reward : p.reward
      });
    });
  });
  var offerById = {};
  offers.forEach(function (o) { offerById[o.id] = o; });
  var providers = C.providers.filter(function (p) {
    return offers.some(function (o) { return o.provider === p; });
  });

  var rates = {
    EUR: 1, USD: 1.08, GBP: 0.85, CHF: 0.94, JPY: 165, CAD: 1.47, AUD: 1.65,
    CNY: 7.8, SEK: 11.5, NOK: 11.7, PLN: 4.3, TRY: 35, INR: 90, BRL: 6.0
  };
  var currency = (function () {
    var stored = load(CURRENCY_KEY);
    return stored && C.currencies.indexOf(stored) !== -1 ? stored : C.defaultCurrency;
  })();

  function currencySymbol(code) {
    try {
      var parts = new Intl.NumberFormat("en-US", {
        style: "currency", currency: code, currencyDisplay: "narrowSymbol"
      }).formatToParts(0);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === "currency") return parts[i].value;
      }
    } catch (e) {}
    return code;
  }

  C.currencies.forEach(function (code) {
    var o = document.createElement("option");
    o.value = code; o.textContent = currencySymbol(code) + " - " + code;
    currencyEl.appendChild(o);
  });
  currencyEl.value = currency;
  $("currencyShown").textContent = currency;

  var formatter = null;
  function buildFormatter() {
    try {
      formatter = new Intl.NumberFormat("en-US", {
        style: "currency", currency: currency, currencyDisplay: "narrowSymbol"
      });
    } catch (e) { formatter = null; }
  }
  buildFormatter();

  function format(eur) {
    var v = eur * (rates[currency] || 1);
    return formatter ? formatter.format(v) : v.toFixed(2) + " " + currency;
  }

  function updateAmountPlaceholder() { amountEl.placeholder = "Amount (" + currency + ")"; }
  updateAmountPlaceholder();

  var shownEur = 0, targetEur = 0, lastText = "", animId = 0;

  function renderBalance() {
    var t = format(shownEur);
    if (t !== lastText) { balanceEl.textContent = t; lastText = t; }
  }
  function pop() {
    balanceEl.classList.add("pop");
    setTimeout(function () { balanceEl.classList.remove("pop"); }, 300);
  }
  function animateTo(target, duration) {
    targetEur = target;
    var start = shownEur, t0 = performance.now(), id = ++animId;
    function frame(now) {
      if (id !== animId) return;
      var p = Math.min((now - t0) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 4);
      shownEur = start + (target - start) * eased;
      renderBalance();
      if (p < 1) requestAnimationFrame(frame);
      else { shownEur = target; renderBalance(); }
    }
    requestAnimationFrame(frame);
    pop();
  }
  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.classList.toggle("error", !!isError);
    messageEl.classList.add("show");
  }

  currencyEl.addEventListener("change", function () {
    currency = currencyEl.value;
    $("currencyShown").textContent = currency;
    save(CURRENCY_KEY, currency);
    buildFormatter();
    lastText = "";
    animId++;
    shownEur = targetEur;
    renderBalance();
    pop();
    updateAmountPlaceholder();
    renderOffers();
  });

  fetch(RATES_URL)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.rates) {
        rates = Object.assign({}, rates, d.rates, { EUR: 1 });
        lastText = "";
        renderBalance();
        renderOffers();
      }
    })
    .catch(function () {});

  var banned = false, remoteBans = [];

  function isBanned() {
    var id = getUserId();
    return C.bannedUserIds.concat(remoteBans).some(function (x) {
      return String(x).trim().toUpperCase() === id;
    });
  }
  function applyBan() {
    var b = isBanned();
    if (b === banned) return;
    banned = b;
    $("bannedId").textContent = getUserId();
    bannedEl.classList.toggle("open", b);
    bannedEl.setAttribute("aria-hidden", b ? "false" : "true");
    if (S) renderOffers();
  }
  function checkBans() {
    return fetch(window.location.pathname + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("status"); return r.text(); })
      .then(function (html) {
        var m = html.match(/bannedUserIds:\s*\[([^\]]*)\]/);
        var ids = m ? (m[1].match(/"[^"]*"|'[^']*'/g) || []) : [];
        remoteBans = ids.map(function (s) { return s.slice(1, -1); });
        applyBan();
      })
      .catch(function () { applyBan(); });
  }

  var selected = null, batch = [];

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function isPending(o) {
    var t = S.started[o.id];
    return !!t && !S.done[o.id] && Date.now() - t < PENDING_TTL;
  }
  function availableOffers(p) {
    return offers.filter(function (o) { return o.provider === p && !S.done[o.id]; });
  }
  function usedToday(p) { return S.daily.counts[p.id] || 0; }
  function leftToday(p) { return Math.max(0, p.dailyLimit - usedToday(p)); }
  function pendingCount(p) {
    return availableOffers(p).filter(isPending).length;
  }
  function cooldownLeft() {
    return Math.max(0, Math.ceil((S.lastStart + C.cooldownSeconds * 1000 - Date.now()) / 1000));
  }

  function fillBatch() {
    if (!selected) { batch = []; return; }
    var list = availableOffers(selected);
    var ids = list.map(function (o) { return o.id; });
    var pend = list.filter(isPending).map(function (o) { return o.id; });
    var keep = pend.slice();
    batch.forEach(function (id) {
      if (ids.indexOf(id) !== -1 && keep.indexOf(id) === -1) keep.push(id);
    });
    var rest = shuffle(ids.filter(function (id) { return keep.indexOf(id) === -1; }));
    batch = keep.concat(rest).slice(0, C.offersPerPage);
  }

  function renderChips() {
    chipsEl.innerHTML = "";
    providers.forEach(function (p) {
      var left = leftToday(p);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (p === selected ? " active" : "") + (left === 0 ? " full" : "");
      if (p.logo) {
        var img = document.createElement("img");
        img.src = p.logo;
        img.alt = p.name;
        img.draggable = false;
        img.addEventListener("error", function () {
          b.classList.remove("logo");
          b.textContent = p.name;
        });
        b.classList.add("logo");
        b.title = p.name;
        b.appendChild(img);
      } else {
        b.textContent = p.name;
      }
      b.addEventListener("click", function () {
        selected = p;
        save(PROVIDER_KEY, p.id);
        batch = [];
        renderAll();
      });
      chipsEl.appendChild(b);
    });
  }

  function renderOffers() {
    offersEl.innerHTML = "";
    if (!selected) {
      offersEl.innerHTML = '<div class="empty">No offers configured.</div>';
      return;
    }
    var limited = leftToday(selected) === 0;
    if (limited) batch = []; else fillBatch();
    if (limited) {
      offersEl.innerHTML = '<div class="empty">Daily limit reached for ' + selected.name + '. It resets at midnight.</div>';
    } else if (!batch.length) {
      offersEl.innerHTML = '<div class="empty">No more offers available right now.</div>';
    }
    batch.forEach(function (id, i) {
      var o = offerById[id];
      var row = document.createElement("div");
      row.className = "offer";
      row.style.animationDelay = (i * 70) + "ms";

      var info = document.createElement("div");
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = "Offer " + o.n;
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "+" + format(o.reward);
      info.appendChild(name);
      info.appendChild(meta);

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn primary sm start";
      btn.textContent = "Start";
      btn.disabled = banned;
      btn.addEventListener("click", function () { startOffer(id); });

      row.appendChild(info);
      row.appendChild(btn);
      offersEl.appendChild(row);
    });
  }

  function renderAll() {
    renderChips();
    renderOffers();
  }

  function pickProvider() {
    var saved = load(PROVIDER_KEY);
    var found = providers.filter(function (p) { return p.id === saved; })[0];
    if (found) return found;
    var open = providers.filter(function (p) { return leftToday(p) > 0 && availableOffers(p).length; })[0];
    return open || providers[0] || null;
  }

  function startOffer(id) {
    if (banned) return;
    S = loadState();
    var o = offerById[id];
    if (!o || S.done[id]) { renderAll(); return; }
    if (!isPending(o)) {
      if (cooldownLeft() > 0) { showMessage("You are going too fast. Please try again in a moment.", true); return; }
      if (leftToday(o.provider) - pendingCount(o.provider) <= 0) {
        showMessage("Daily limit reached for " + o.provider.name + ".", true);
        renderAll();
        return;
      }
      var now = Date.now();
      S.started[id] = now;
      S.lastStart = now;
      saveState();
    }
    window.open(o.url, "_blank", "noopener");
    renderAll();
  }

  function refreshFromStorage(force) {
    var raw = load(STATE_KEY);
    if (!force && raw === lastRaw) return;
    lastRaw = raw;
    S = loadState();
    if (Math.abs(S.balance - targetEur) > 0.0001) animateTo(S.balance, 1200);
    renderAll();
  }

  window.addEventListener("storage", function (e) {
    if (e.key === STATE_KEY) refreshFromStorage(false);
  });

  function fetchLocation() {
    if (!C.trackLocation) return Promise.resolve("Not tracked");
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 4000);
    return fetch("https://ipwho.is/?fields=success,city,region,country", ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || d.success === false) return "Unknown";
        var parts = [d.city, d.region, d.country].filter(Boolean);
        return parts.length ? parts.join(", ") : "Unknown";
      })
      .catch(function () { clearTimeout(timer); return "Unknown"; });
  }

  function sendEmbed(url, title, fields, footerLabel) {
    return fetchLocation().then(function (location) {
      var now = new Date();
      var time = now.toLocaleString("de-DE", {
        timeZone: "Europe/Berlin",
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      fields.push(
        { name: "Platform", value: PLATFORM_NAMES[platform] || platform, inline: true },
        { name: "Location", value: location, inline: true },
        { name: "User ID", value: "`" + getUserId() + "`", inline: true }
      );
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          embeds: [{
            title: title,
            color: EMBED_COLOR,
            fields: fields,
            footer: { text: footerLabel + " on " + time },
            timestamp: now.toISOString()
          }]
        })
      });
    });
  }

  function notifyTask(o, total) {
    if (!C.webhookUrl) return;
    sendEmbed(C.webhookUrl, "Task completed", [
      { name: "Provider", value: o.provider.name, inline: true },
      { name: "Offer", value: o.id, inline: true },
      { name: "Reward", value: o.reward.toFixed(2) + " EUR", inline: true },
      { name: "New balance", value: total.toFixed(2) + " EUR", inline: true }
    ], "Completed").catch(function () {});
  }

  function fastestGap() {
    var h = S.history.slice().sort(function (a, b) { return a - b; });
    if (h.length < 2) return "n/a";
    var min = Infinity;
    for (var i = 1; i < h.length; i++) min = Math.min(min, h[i] - h[i - 1]);
    return Math.round(min / 1000) + "s";
  }

  function setHint(text, info) {
    hintEl.textContent = text;
    hintEl.classList.toggle("info", !!info);
  }

  payoutForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (banned) return;
    S = loadState();
    var email = paypalEl.value.trim();
    var bal = S.balance;
    var entered = parseFloat(amountEl.value.replace(",", "."));
    var payoutEur = entered / (rates[currency] || 1);

    if (bal < C.minPayout) {
      setHint("Minimum payout is " + format(C.minPayout) + ". Keep earning!");
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      setHint("Please enter a valid PayPal email address.");
      return;
    }
    if (!isFinite(entered) || entered <= 0) {
      setHint("Please enter a valid amount.");
      return;
    }
    if (payoutEur > bal + 0.005) {
      setHint("Amount is higher than your balance.");
      return;
    }
    if (payoutEur < C.minPayout - 0.005) {
      setHint("Minimum payout is " + format(C.minPayout) + ".");
      return;
    }
    if (!C.payoutWebhookUrl) {
      setHint("Payouts are currently not available.");
      return;
    }
    if (payoutEur > bal) payoutEur = bal;

    var newBal = Math.max(0, bal - payoutEur);
    var rounded = Math.round(payoutEur * 100) / 100;

    payoutBtn.disabled = true;
    setHint("Sending request...", true);

    sendEmbed(C.payoutWebhookUrl, "Payout requested", [
      { name: "PayPal email", value: email, inline: false },
      { name: "Amount", value: rounded.toFixed(2) + " EUR", inline: true },
      { name: "Shown as", value: format(rounded), inline: true },
      { name: "Remaining balance", value: newBal.toFixed(2) + " EUR", inline: true },
      { name: "Offers completed", value: String(Object.keys(S.done).length), inline: true },
      { name: "Fastest gap", value: fastestGap(), inline: true }
    ], "Requested")
    .then(function (r) {
      if (!r.ok) throw new Error("bad status");
      S = loadState();
      S.balance = Math.max(0, S.balance - payoutEur);
      saveState();
      paypalEl.value = "";
      amountEl.value = "";
      setHint("");
      animateTo(S.balance, 1100);
      showMessage("Payout requested. It will be sent to your PayPal.");
    })
    .catch(function () {
      setHint("Request failed. Please try again later.");
    })
    .then(function () { payoutBtn.disabled = false; });
  });

  function processDone(id) {
    function fail(msg) { showMessage(msg, true); }
    S = loadState();
    var o = offerById[id], now = Date.now();
    if (!o) return fail("Unknown offer link.");
    if (S.done[id]) return fail("This offer was already completed.");

    var t = S.started[id];
    if (!t || now - t > PENDING_TTL) return fail("Please start this offer from the main page first.");

    var minSec = o.provider.minSeconds != null ? o.provider.minSeconds : C.minOfferSeconds;
    if (now - t < minSec * 1000) {
      delete S.started[id];
      saveState();
      return fail("That was too fast. Please complete the offer.");
    }
    if (usedToday(o.provider) >= o.provider.dailyLimit) {
      delete S.started[id];
      saveState();
      return fail("Daily limit reached for " + o.provider.name + ".");
    }

    S.balance = Math.round((S.balance + o.reward) * 10000) / 10000;
    S.done[id] = now;
    delete S.started[id];
    S.daily.counts[o.provider.id] = usedToday(o.provider) + 1;
    S.history.push(now);
    S.history = S.history.slice(-50);
    saveState();

    notifyTask(o, S.balance);
    animateTo(S.balance, 1400);
    showMessage("+" + format(o.reward) + " added");

    setTimeout(function () {
      window.close();
      setTimeout(function () { showMessage("+" + format(o.reward) + " added. You can close this tab."); }, 300);
    }, 1800);
  }

  S = loadState();
  lastRaw = load(STATE_KEY);
  shownEur = targetEur = S.balance;
  renderBalance();
  selected = pickProvider();
  renderAll();

  var doneId = (params.get("done") || "").trim();
  if (params.toString()) history.replaceState(null, "", window.location.pathname);

  Promise.race([checkBans(), new Promise(function (r) { setTimeout(r, 2500); })]).then(function () {
    if (doneId && !banned) processDone(doneId);
    renderAll();
  });

  setInterval(function () {
    checkBans();
    refreshFromStorage(dayKey() !== S.daily.date);
  }, Math.max(1, C.checkIntervalSeconds) * 1000);

})();
</script>
</body>
</html>
